# spot-cluster.yaml

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: roboshop
  region: us-east-1

managedNodeGroups: 
- name: spotNew
  instanceType: ["c3.large","c4.large","c5.large","c5d.large","c5n.large","c5a.large","t3.small","t3.large","t3.medium","t3.micro"]  # Your new instance type removed t3.micro
  spot: true
  desiredCapacity: 4
  